<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Film Channel</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080808;
  color:white;
}

header{
  padding:20px 15px;
  background:linear-gradient(135deg,#171717,#050505);
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

.logo span{
  color:#e50914;
}

.search{
  margin-top:15px;
}

.search input{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  outline:none;
  background:#242424;
  color:white;
}

.container{
  padding:18px 14px 80px;
}

h2{
  margin:10px 0 15px;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
}

.categories button{
  flex:none;
  border:1px solid #333;
  background:#171717;
  color:white;
  padding:9px 15px;
  border-radius:20px;
}

.categories button.active{
  background:#e50914;
}

.movies{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  margin-top:18px;
}

.movie{
  background:#151515;
  border-radius:14px;
  overflow:hidden;
  border:1px solid #292929;
}

.poster{
  height:210px;
  background:#222;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
}

.info{
  padding:11px;
}

.title{
  font-weight:bold;
}

.meta{
  color:#999;
  font-size:12px;
  margin-top:6px;
}

.watch{
  width:100%;
  margin-top:10px;
  padding:9px;
  border:0;
  border-radius:8px;
  background:#e50914;
  color:white;
  font-weight:bold;
}

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:62px;
  background:#111;
  border-top:1px solid #292929;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

nav button{
  background:none;
  border:0;
  color:#aaa;
  font-size:12px;
}

nav button.active{
  color:white;
}

.icon{
  display:block;
  font-size:21px;
  margin-bottom:3px;
}
</style>
</head>

<body>

<header>

<div class="logo">
🎬 <span>FILM</span> CHANNEL
</div>

<div class="search">
<input
id="search"
type="text"
placeholder="Search movies..."
oninput="searchMovies()">
</div>

</header>

<main class="container">

<h2>🔥 Trending Movies</h2>

<div class="categories">

<button class="active">All</button>
<button>Action</button>
<button>Drama</button>
<button>Comedy</button>
<button>Series</button>

</div>

<div class="movies" id="movies">

<div class="movie" data-title="My First Movie">

<div class="poster">
🎬
</div>

<div class="info">

<div class="title">
My First Movie
</div>

<div class="meta">
2026 • Action
</div>

<button class="watch"
onclick="watchMovie('My First Movie')">
▶ Watch
</button>

</div>

</div>


<div class="movie" data-title="My First Series">

<div class="poster">
📺
</div>

<div class="info">

<div class="title">
My First Series
</div>

<div class="meta">
2026 • Series
</div>

<button class="watch"
onclick="watchMovie('My First Series')">
▶ Watch
</button>

</div>

</div>

</div>

</main>

<nav>

<button class="active">
<span class="icon">🏠</span>
Home
</button>

<button>
<span class="icon">🎬</span>
Movies
</button>

<button>
<span class="icon">📺</span>
Series
</button>

<button>
<span class="icon">⭐</span>
Favorites
</button>

</nav>

<script>

function watchMovie(title){

alert("Opening: " + title);

}

function searchMovies(){

const text =
document.getElementById("search")
.value
.toLowerCase();

const movies =
document.querySelectorAll(".movie");

movies.forEach(movie => {

const title =
movie.dataset.title.toLowerCase();

movie.style.display =
title.includes(text)
? "block"
: "none";

});

}

</script>

</body>
</html>
