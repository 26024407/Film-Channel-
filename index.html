<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Film Channel</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07131c;
  color:white;
}

header{
  padding:22px 16px;
  text-align:center;
  background:linear-gradient(135deg,#8b0000,#170000);
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  color:#ddd;
}

.container{
  max-width:700px;
  margin:auto;
  padding:16px 14px 80px;
}

.search{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#162733;
  color:white;
  outline:none;
  margin-bottom:15px;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:18px;
}

.categories button{
  flex:none;
  padding:9px 15px;
  border:1px solid #294554;
  border-radius:20px;
  background:#12232e;
  color:white;
}

.categories .active{
  background:#e50914;
}

.films{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.film{
  background:#12232e;
  border:1px solid #243d4a;
  border-radius:14px;
  overflow:hidden;
}

.film img{
  width:100%;
  height:150px;
  object-fit:cover;
}

.film-info{
  padding:10px;
}

.film h3{
  margin:0 0 7px;
  font-size:16px;
}

.meta{
  color:#9fb2ba;
  font-size:12px;
}

.watch{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:0;
  border-radius:9px;
  background:#e50914;
  color:white;
  font-weight:bold;
}

.empty{
  text-align:center;
  color:#aaa;
  padding:30px;
  grid-column:1/-1;
}

/* PAYMENT */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  z-index:2000;
  padding:20px;
}

.payment-box{
  max-width:420px;
  margin:60px auto;
  background:#12232e;
  border:1px solid #315261;
  border-radius:18px;
  padding:20px;
}

.payment-box h2{
  margin-top:0;
}

.method{
  padding:15px;
  margin:10px 0;
  border:1px solid #315261;
  border-radius:12px;
  background:#0b1d27;
  cursor:pointer;
}

.method.selected{
  border-color:#00c853;
  background:#123b2b;
}

.method strong{
  display:block;
  font-size:18px;
}

.payment-box input{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:0;
  border-radius:9px;
  background:#203744;
  color:white;
  outline:none;
}

.confirm{
  width:100%;
  padding:13px;
  margin-top:12px;
  border:0;
  border-radius:9px;
  background:#198754;
  color:white;
  font-weight:bold;
}

.cancel{
  width:100%;
  padding:11px;
  margin-top:8px;
  border:0;
  border-radius:9px;
  background:#444;
  color:white;
}

.account{
  background:#07131c;
  padding:12px;
  border-radius:10px;
  margin-top:12px;
  font-size:14px;
}

.player{
  display:none;
  position:fixed;
  inset:0;
  background:#000;
  z-index:3000;
}

.player iframe{
  width:100%;
  height:100%;
  border:0;
}

.close{
  position:absolute;
  top:15px;
  right:15px;
  z-index:3001;
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#e50914;
  color:white;
  font-size:22px;
}
</style>
</head>

<body>

<header>
  <h1>🎬 Film Channel</h1>
  <p>ፊልሞችን በቀላሉ ይመልከቱ</p>
</header>

<main class="container">

<input
  id="search"
  class="search"
  type="text"
  placeholder="🔎 ፊልም ፈልግ..."
  oninput="searchFilms()"
>

<div class="categories">
  <button class="active">ሁሉም</button>
  <button>Action</button>
  <button>Drama</button>
  <button>Comedy</button>
  <button>Series</button>
</div>

<h2>🔥 ፊልሞች</h2>

<div id="films" class="films"></div>

</main>

<!-- PAYMENT MODAL -->

<div id="paymentModal" class="modal">

  <div class="payment-box">

    <h2>🔐 ፊልሙን ለማየት ክፈል</h2>

    <p id="selectedFilm"></p>

    <div
      class="method"
      id="cbeMethod"
      onclick="selectMethod('CBE')">

      <strong>🏦 CBE</strong>
      20 ብር

    </div>

    <div
      class="method"
      id="telebirrMethod"
      onclick="selectMethod('Telebirr')">

      <strong>📱 Telebirr</strong>
      15 ብር

    </div>

    <div id="accountInfo" class="account">
      የክፍያ ዘዴ ይምረጡ
    </div>

    <input
      id="transaction"
      placeholder="Transaction ID ያስገቡ"
    >

    <button
      class="confirm"
      onclick="submitPayment()">

      ✅ ክፍያ ላክ

    </button>

    <button
      class="cancel"
      onclick="closePayment()">

      ተመለስ

    </button>

  </div>

</div>

<!-- VIDEO PLAYER -->

<div id="player" class="player">

  <button
    class="close"
    onclick="closePlayer()">

    ×

  </button>

  <iframe
    id="videoFrame"
    allowfullscreen
    allow="autoplay; encrypted-media">
  </iframe>

</div>

  document.getElementById("paymentModal")

}

  const text =
    document.getElementById("search")
    .value

  const result=films.filter(f =>

  );

  showFilms(result);

/* PLAYER */

  document.getElementById("player").style.display="block";

}


function closePlayer(){

  document.getElementById("videoFrame").src="";

  document.getElementById("player").style.display="none";

}
