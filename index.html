<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Film Channel</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07131c;
  color:white;
}

header{
  padding:22px 16px;
  text-align:center;
  background:linear-gradient(135deg,#8b0000,#170000);
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:7px 0 0;
  color:#ddd;
}

.container{
  padding:16px;
  max-width:700px;
  margin:auto;
}

.search{
  width:100%;
  padding:14px;
  border:0;
  outline:none;
  border-radius:12px;
  background:#162733;
  color:white;
  font-size:16px;
  margin-bottom:15px;
}

.films{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.film{
  background:#12232e;
  border:1px solid #243d4a;
  border-radius:14px;
  overflow:hidden;
}

.film img{
  width:100%;
  height:150px;
  object-fit:cover;
  display:block;
}

.film-info{
  padding:10px;
}

.film h3{
  margin:0 0 8px;
  font-size:16px;
}

.watch{
  width:100%;
  border:0;
  padding:10px;
  border-radius:9px;
  background:#e50914;
  color:white;
  font-weight:bold;
}

.empty{
  text-align:center;
  color:#aaa;
  padding:30px;
  grid-column:1/-1;
}

.player{
  display:none;
  position:fixed;
  inset:0;
  background:#000;
  z-index:1000;
}

.player iframe{
  width:100%;
  height:100%;
  border:0;
}

.close{
  position:absolute;
  top:15px;
  right:15px;
  z-index:1001;
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#e50914;
  color:white;
  font-size:22px;
}

.add-box{
  margin-top:20px;
  padding:15px;
  background:#12232e;
  border-radius:14px;
}

.add-box h2{
  font-size:18px;
}

.add-box input{
  width:100%;
  padding:12px;
  margin:5px 0;
  border:0;
  border-radius:9px;
  background:#203744;
  color:white;
}

.add-box button{
  width:100%;
  padding:12px;
  margin-top:7px;
  border:0;
  border-radius:9px;
  background:#198754;
  color:white;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
  <h1>🎬 Film Channel</h1>
  <p>ፊልሞችን በቀላሉ ይመልከቱ</p>
</header>

<div class="container">

<input
  id="search"
  class="search"
  type="text"
  placeholder="🔎 ፊልም ፈልግ..."
  oninput="searchFilms()"
>

<div id="films" class="films"></div>

<div class="add-box">
  <h2>➕ ፊልም ጨምር</h2>

  <input id="title" placeholder="የፊልሙ ስም">

  <input id="image"
         placeholder="የፎቶ ሊንክ">

  <input id="video"
         placeholder="YouTube Video ID">

  <button onclick="addFilm()">ፊልም ጨምር</button>
</div>

</div>

<div id="player" class="player">
  <button class="close" onclick="closePlayer()">×</button>
  <iframe id="videoFrame"
          allowfullscreen
          allow="autoplay; encrypted-media">
  </iframe>
</div>

<script>

let films = [
  {
    title:"Example Film 1",
    image:"https://picsum.photos/500/300?random=1",
    video:"dQw4w9WgXcQ"
  },
  {
    title:"Example Film 2",
    image:"https://picsum.photos/500/300?random=2",
    video:"dQw4w9WgXcQ"
  }
];

function showFilms(list=films){

  const box=document.getElementById("films");

  box.innerHTML="";

  if(list.length===0){
    box.innerHTML='<div class="empty">ፊልም አልተገኘም</div>';
    return;
  }

  list.forEach((film,index)=>{

    box.innerHTML += `
      <div class="film">

        <img
          src="${film.image}"
          alt="${film.title}"
          onerror="this.src='https://picsum.photos/500/300'"
        >

        <div class="film-info">

          <h3>${film.title}</h3>

          <button
            class="watch"
            onclick="watchFilm(${index})">
            ▶ ይመልከቱ
          </button>

        </div>

      </div>
    `;

  });
}

function watchFilm(index){

  const film=films[index];

  document.getElementById("videoFrame").src =
    "https://www.youtube.com/embed/" +
    film.video +
    "?autoplay=1";

  document.getElementById("player").style.display="block";
}

function closePlayer(){

  document.getElementById("videoFrame").src="";

  document.getElementById("player").style.display="none";
}

function searchFilms(){

  const text=
    document.getElementById("search")
    .value
    .toLowerCase();

  const result=films.filter(f =>
    f.title.toLowerCase().includes(text)
  );

  showFilms(result);
}

function addFilm(){

  const title=
    document.getElementById("title").value.trim();

  const image=
    document.getElementById("image").value.trim();

  const video=
    document.getElementById("video").value.trim();

  if(!title || !video){

    alert("የፊልሙን ስም እና YouTube Video ID ያስገቡ");

    return;
  }

  films.push({
    title:title,
    image:image || "https://picsum.photos/500/300",
    video:video
  });

  document.getElementById("title").value="";
  document.getElementById("image").value="";
  document.getElementById("video").value="";

  showFilms();

  alert("ፊልሙ ተጨምሯል ✅");
}

showFilms();

</script>

</body>
</html>
