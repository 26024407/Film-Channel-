<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Film Channel</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07131c;
  color:#fff;
}

header{
  padding:22px 16px;
  text-align:center;
  background:linear-gradient(135deg,#8b0000,#170000);
}

header h1{margin:0;font-size:28px}
header p{color:#ddd}

.container{
  max-width:700px;
  margin:auto;
  padding:16px 14px 80px;
}

.search{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#162733;
  color:white;
  outline:none;
  margin-bottom:16px;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:18px;
}

.categories button{
  flex:none;
  border:1px solid #294554;
  background:#12232e;
  color:white;
  padding:9px 15px;
  border-radius:20px;
}

.categories .active{
  background:#e50914;
}

.films{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.film{
  background:#12232e;
  border:1px solid #243d4a;
  border-radius:14px;
  overflow:hidden;
}

.film img{
  width:100%;
  height:150px;
  object-fit:cover;
}

.film-info{padding:10px}

.film h3{
  margin:0 0 7px;
  font-size:16px;
}

.meta{
  color:#9fb2ba;
  font-size:12px;
}

.watch{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:0;
  border-radius:9px;
  background:#e50914;
  color:white;
  font-weight:bold;
}

.pay{
  background:#198754;
}

.empty{
  text-align:center;
  color:#aaa;
  padding:30px;
  grid-column:1/-1;
}

.payment{
  display:none;
  position:fixed;
  inset:0;
  background:#07131c;
  z-index:2000;
  overflow:auto;
  padding:25px 15px;
}

.payment-box{
  max-width:500px;
  margin:auto;
  background:#12232e;
  border-radius:18px;
  padding:20px;
}

.payment-box h2{
  text-align:center;
}

.method{
  background:#203744;
  border:1px solid #34515f;
  padding:15px;
  margin:10px 0;
  border-radius:12px;
}

.method button{
  width:100%;
  margin-top:8px;
  padding:11px;
  border:0;
  border-radius:9px;
  background:#198754;
  color:white;
  font-weight:bold;
}

.payment input{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:0;
  border-radius:9px;
  background:#203744;
  color:white;
}

.closePay{
  float:right;
  border:0;
  border-radius:50%;
  width:40px;
  height:40px;
  background:#e50914;
  color:white;
  font-size:20px;
}

.player{
  display:none;
  position:fixed;
  inset:0;
  background:#000;
  z-index:3000;
}

.player iframe{
  width:100%;
  height:100%;
  border:0;
}

.close{
  position:absolute;
  top:15px;
  right:15px;
  z-index:3001;
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#e50914;
  color:white;
  font-size:22px;
}

.admin{
  margin-top:25px;
  padding:15px;
  background:#12232e;
  border-radius:14px;
}

.admin button{
  width:100%;
  padding:11px;
  margin-top:8px;
  border:0;
  border-radius:9px;
  background:#555;
  color:white;
}

@media(max-width:420px){
  .films{grid-template-columns:repeat(2,1fr)}
  .film img{height:130px}
}
</style>
</head>

<body>

<header>
  <h1>🎬 Film Channel</h1>
  <p>ፊልሞችን በቀላሉ ይመልከቱ</p>
</header>

<main class="container">

<input
  id="search"
  class="search"
  placeholder="🔎 ፊልም ፈልግ..."
  oninput="searchFilms()"
>

<div class="categories">
  <button class="active">ሁሉም</button>
  <button>Action</button>
  <button>Drama</button>
  <button>Comedy</button>
  <button>Series</button>
</div>

<h2>🔥 ፊልሞች</h2>

<div id="films" class="films"></div>

<div class="admin">
  <h3>🔐 Admin</h3>
  <p>ይህ ክፍል ለፊልም መጨመር ነው።</p>

  <input id="title" placeholder="የፊልሙ ስም">
  <input id="image" placeholder="የፎቶ ሊንክ">
  <input id="video" placeholder="YouTube Video ID">

  <button onclick="addFilm()">➕ ፊልም ጨምር</button>
</div>

</main>

<!-- PAYMENT -->
<div id="payment" class="payment">

<div class="payment-box">

<button class="closePay" onclick="closePayment()">×</button>

<h2>💳 ፊልሙን ለማየት ክፈል</h2>

<p id="selectedMovie"></p>

<div class="method">
<b>🏦 CBE / ንግድ ባንክ</b>
<p>ዋጋ: <strong>20 ብር</strong></p>
<p>የክፍያ ሂሳብ:</p>
<strong>1000341152864</strong>
</div>

<div class="method">
<b>📱 Telebirr</b>
<p>ዋጋ: <strong>15 ብር</strong></p>
<p>የክፍያ ቁጥር:</p>
<strong>+251926024407</strong>
</div>

<h3>🧾 የክፍያ ማስረጃ</h3>

<input id="payerName" placeholder="ስም">

<input id="transactionId"
       placeholder="Transaction ID / Reference">

<button class="pay"
        onclick="submitPayment()">
📤 ክፍያ ማስረጃ ላክ
</button>

<p id="paymentStatus"></p>

</div>
</div>

<!-- PLAYER -->
<div id="player" class="player">

<button class="close" onclick="closePlayer()">×</button>

<iframe
  id="videoFrame"
  allowfullscreen
  allow="autoplay; encrypted-media">
</iframe>

</div>

<script>

let films = [

{
  title:"Example Film 1",
  image:"https://picsum.photos/500/300?random=1",
  video:"dQw4w9WgXcQ",
  priceCBE:20,
  priceTelebirr:15
},

{
  title:"Example Film 2",
  image:"https://picsum.photos/500/300?random=2",
  video:"dQw4w9WgXcQ",
  priceCBE:20,
  priceTelebirr:15
}

];

let selectedFilm = null;

function showFilms(list=films){

const box=document.getElementById("films");

box.innerHTML="";

if(list.length===0){

box.innerHTML=
'<div class="empty">ፊልም አልተገኘም 😔</div>';

return;

}

list.forEach((film,index)=>{

box.innerHTML += `

<div class="film">

<img
src="${film.image}"
alt="${film.title}"
onerror="this.src='https://picsum.photos/500/300'"
>

<div class="film-info">

<h3>${film.title}</h3>

<div class="meta">
🎬 Film Channel
</div>

<button
class="watch"
onclick="openPayment(${index})">

🔒 ለማየት ክፈል

</button>

</div>

</div>

`;

});

}

function openPayment(index){

selectedFilm=films[index];

document.getElementById("selectedMovie").innerHTML=
"🎬 <b>"+selectedFilm.title+"</b>";

document.getElementById("payment").style.display="block";

document.getElementById("paymentStatus").innerText="";

}

function closePayment(){

document.getElementById("payment").style.display="none";

}

function submitPayment(){

const name=
document.getElementById("payerName").value.trim();

const transaction=
document.getElementById("transactionId").value.trim();

if(!name || !transaction){

alert("ስም እና Transaction ID ያስገቡ");

return;

}

document.getElementById("paymentStatus").innerHTML=
"⏳ ክፍያዎ ለማረጋገጥ ተልኳል።<br>Admin ካረጋገጠ በኋላ ፊልሙ ይከፈታል።";

}

function watchFilm(index){

const film=films[index];

document.getElementById("videoFrame").src=
"https://www.youtube.com/embed/"
+film.video+
"?autoplay=1";

document.getElementById("player").style.display="block";

}

function closePlayer(){

document.getElementById("videoFrame").src="";

document.getElementById("player").style.display="none";

}

function searchFilms(){

const text=
document.getElementById("search")
.value
.toLowerCase();

const result=films.filter(f =>
f.title.toLowerCase().includes(text)
);

showFilms(result);

}

function addFilm(){

const title=
document.getElementById("title").value.trim();

const image=
document.getElementById("image").value.trim();

const video=
document.getElementById("video").value.trim();

if(!title || !video){

alert("የፊልሙን ስም እና YouTube Video ID ያስገቡ");

return;

}

films.push({

title:title,

image:image ||
"https://picsum.photos/500/300",

video:video,

priceCBE:20,

priceTelebirr:15

});

document.getElementById("title").value="";
document.getElementById("image").value="";
document.getElementById("video").value="";

showFilms();

alert("ፊልሙ ተጨምሯል ✅");

}

showFilms();

</script>

</body>
</html>
